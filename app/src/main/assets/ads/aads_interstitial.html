<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>A-Ads Interstitial</title>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; }
        #ad-container { width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="ad-container"></div>
    <script async src="https://a-ads.com/AD_ZONE_ID.js"></script>
    <script>
        // Notify Android when ad is loaded
        window.addEventListener('load', function() {
            if (window.AndroidInterface) {
                window.AndroidInterface.onAdLoaded();
            }
        });
        
        // Notify Android when ad is clicked/closed
        document.addEventListener('click', function() {
            if (window.AndroidInterface) {
                window.AndroidInterface.onAdClicked();
            }
        });
    </script>
</body>
</html>
